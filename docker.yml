services:
  postgres:
    image: postgres:16
    container_name: waterpolo_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)
      POSTGRES_DB: $(POSTGRES_DB)
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - waterpolo_pgdata:/var/lib/postgresql/data

volumes:
  waterpolo_pgdata:
